"$schema" = "./node_modules/wrangler/config-schema.json"

name = "winchester-kiwanis"
compatibility_date = "2026-04-16"
pages_build_output_dir = "_site"

[ai]
binding = "AI"

# Private storage for the admin "Manage People" list (club Cloudflare account, namespace "kiwanis-website-people").
[[kv_namespaces]]
binding = "ACCESS"
id = "2e6f9ac2bac9421eae2ffb1271646b71"

[vars]
KIWANIS_ASSISTANT_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"
KIWANIS_ASSISTANT_MODEL_FALLBACK = "@cf/meta/llama-3.1-8b-instruct-fp8"
KIWANIS_ASSISTANT_MODEL_CANDIDATES = "@cf/qwen/qwen3-30b-a3b-fp8,@cf/meta/llama-3.1-8b-instruct-fp8"
# Editor/Admin portal publishing (non-secret). Secrets and the editor/admin email lists live in the Cloudflare dashboard.
GITHUB_OWNER = "Winchester-Kiwanis"
GITHUB_REPO = "kiwanis-winchester"
GITHUB_BRANCH = "main"
EDITOR_EMAIL_FROM = "Kiwanis Website <website@winvakiw.org>"
EDITOR_COMMITTER_NAME = "Kiwanis Website Editor"
EDITOR_COMMITTER_EMAIL = "website-editor@winvakiw.org"
